<!DOCTYPE html>
<!-- Указываю стандарт HTML5, чтобы сайт везде отображался современно -->
<html lang="ru">
  <!-- Главный контейнер сайта, язык — русский -->
  <head>
    <!-- Открываю  настройки -->

    <meta charset="UTF-8" />
    <!-- Кодировка: чтобы все буквы и символы читались без ошибок -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Адаптивность: подстраиваю масштаб под ширину экрана телефона -->
    <title>Resto App</title>
    <!-- Здесь заголовок во вкладке браузера -->
    <!-- Ускоряю загрузку шрифтов, заранее связываясь с серверами Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Подключаю шрифт Inter с нужной толщиной (400 и 600) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <!-- Подключаю файл со стилями  -->
    <link rel="stylesheet" href="./style.css" />
  </head>
  <!-- Закрываю  настройки -->

  <!-- Шапка страницы -->
  <body class="page">
    <!-- Начало видимой части сайта -->
    <header class="header">
      <!-- Семантический тег «Шапка» -->
      <div class="container header__container">
        <!-- Контейнер, чтобы контент не прилипал к краям и был по центру (1440px) -->

        <!-- Логотип компании -->

        <a href="#" class="header__logo-link">
          <img src="./images/logo.svg" alt="restoapp" class="header__logo" />
        </a>

        <!-- Основная навигация -->
        <nav class="header__nav">
          <!-- Начинаю блок навигации, тут главные ссылки сайта -->

          <ul class="header__menu-list">
            <!-- Список элементов меню -->
            <li class="header__menu-item">
              <!-- Контейнер первого пункта -->
              <a href="#" class="header__menu-link">Меню</a>
              <!-- Ссылка на раздел меню -->
            </li>
            <!-- Конец первого пункта -->
            <li class="header__menu-item">
              <!-- Контейнер второго пункта -->
              <a href="#" class="header__menu-link">Акции</a>
              <!-- Ссылка на раздел акций -->
            </li>
            <!-- Конец второго пункта -->
            <li class="header__menu-item">
              <!-- Контейнер третьего пункта -->
              <a href="#" class="header__menu-link">О нас</a>
              <!-- Ссылка на информацию о компании -->
            </li>
            <!-- Конец третьего пункта -->
            <li class="header__menu-item">
              <!-- Контейнер четвертого пункта -->
              <a href="#" class="header__menu-link">События</a>
              <!-- Ссылка на раздел новостей/событий -->
            </li>
            <!-- Конец четвертого пункта -->
            <li class="header__menu-item">
              <!-- Контейнер пятого пункта -->
              <a href="#" class="header__menu-link">Зоны доставки</a>
              <!-- Ссылка на карту доставки -->
            </li>
            <!-- Конец пятого пункта -->
          </ul>
          <!-- Закрытие списка меню -->
        </nav>
        <!-- Закрытие блока навигации -->

        <address class="header__contacts">
          <!-- Блок контактной информации -->
          <!-- Ссылка-номер для звонка -->
          <a href="tel:+01234567890" class="header__phone"
            >+0 (123) 456 78-90</a
          >
          <!-- Время работы ресторана -->
          <time class="header__work-time" datetime="10:00"
            >Прием заказов с 10:00 до 22:40</time
          >
        </address>
        <!-- Закрытие блока контактов -->
      </div>
      <!-- Закрытие внутреннего контейнера шапки -->
    </header>
    <!-- Полное закрытие шапки сайта -->

    <main class="main">
      <!-- Начало основного содержимого страницы -->
      <h1 class="visually-hidden">Resto App — сервис заказа и доставки еды</h1>
      <!-- Главный заголовок (скрыт визуально) -->
      <section class="menu">
        <!-- Секция с категориями меню -->
        <div class="container">
          <!-- Ограничивающий контейнер для центровки контента -->
          <h2 class="menu__title">Меню</h2>
          <!-- Видимый заголовок раздела -->
          <ul class="menu__grid">
            <!-- Сетка (список) для карточек категорий -->
            <li class="menu__item">
              <!-- Контейнер первой карточки (Пицца) -->

              <!-- Карточка-ссылка с фоновым изображением -->
              <a href="#" class="card card_pizza">
                <h3 class="card__title">Пицца</h3>
                <!-- Заголовок внутри карточки -->
              </a>
              <!-- Конец ссылки первой карточки -->
            </li>
            <!-- Конец первого элемента списка -->

            <li class="menu__item">
              <!-- Контейнер второй карточки (Супы) -->
              <!-- Карточка-ссылка с фоновым изображением -->
              <a href="#" class="card card_soups">
                <h3 class="card__title">Супы</h3>
                <!-- Заголовок внутри карточки -->
              </a>
              <!-- Конец ссылки второй карточки -->
            </li>
            <!-- Конец второго элемента списка -->

            <li class="menu__item">
              <!-- Контейнер третьей карточки (Горячее) -->
              <!-- Карточка-ссылка с фоновым изображением -->
              <a href="#" class="card card_hot">
                <h3 class="card__title">Горячие блюда</h3>
                <!-- Заголовок внутри карточки -->
              </a>
              <!-- Конец ссылки третьей карточки -->
            </li>
            <!-- Конец третьего элемента списка -->

            <li class="menu__item">
              <!-- Контейнер четвертой карточки (Салаты) -->
              <!-- Карточка-ссылка с фоновым изображением -->
              <a href="#" class="card card_salads">
                <h3 class="card__title">Салаты</h3>
                <!-- Заголовок внутри карточки -->
              </a>
              <!-- Конец ссылки четвертой карточки -->
            </li>
            <!-- Конец четвертого элемента списка -->
          </ul>
          <!-- Закрытие сетки категорий -->
        </div>
        <!-- Закрытие контейнера секции -->
      </section>
      <!-- Закрытие секции меню -->
    </main>
    <!-- Конец основного содержимого страницы -->
  </body>
  <!-- Закрытие видимой части документа -->
</html>
<!-- Финальное закрытие всего HTML-документа -->
